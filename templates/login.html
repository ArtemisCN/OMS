<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · {{ system_name }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=4">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  {% raw %}<style>
    *,*::after,*::before{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;background:#1a1a2e;overflow:hidden;height:100vh}
    #login-page{display:grid;grid-template-columns:1fr 1fr;height:100vh}
    .left-panel{position:relative;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#d4d0dc 0%,#c8c4d0 50%,#bbb7c5 100%);padding:40px 48px;overflow:hidden}
    .left-panel .logo{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;color:#fff;z-index:10;position:relative;letter-spacing:0.3px}
    .left-panel .logo svg{width:34px;height:34px;flex-shrink:0}
    .left-panel .logo .logo-bg{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,0.2),rgba(255,255,255,0.05));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
    .left-panel .logo .logo-text{display:flex;flex-direction:column;line-height:1.2}
    .left-panel .logo .logo-text .brand{font-size:17px;font-weight:700;color:#fff;letter-spacing:0.5px}
    .left-panel .logo .logo-text .sub{font-size:11px;font-weight:400;color:rgba(255,255,255,0.5);letter-spacing:0.2px}
    .characters-wrapper{position:relative;z-index:10;display:flex;align-items:flex-end;justify-content:center;height:420px}
    .left-panel .footer-links{display:flex;gap:28px;font-size:13px;color:rgba(80,70,90,0.7);z-index:10;position:relative}
    .left-panel .footer-links a{color:inherit;text-decoration:none;transition:color .2s}
    .left-panel .footer-links a:hover{color:#333}
    .left-panel::after{content:"";position:absolute;top:20%;right:15%;width:260px;height:260px;background:rgba(180,170,200,0.25);border-radius:50%;filter:blur(80px)}
    .left-panel::before{content:"";position:absolute;bottom:15%;left:10%;width:350px;height:350px;background:rgba(200,195,210,0.2);border-radius:50%;filter:blur(100px)}
    .right-panel{display:flex;align-items:center;justify-content:center;background:#fff;padding:40px}
    .form-container{width:100%;max-width:400px}
    .form-header{text-align:center;margin-bottom:36px}
    .form-header h1{font-size:28px;font-weight:700;color:#1a1a2e;letter-spacing:-0.5px;margin-bottom:6px}
    .form-header p{font-size:14px;color:#888}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;font-size:13px;font-weight:500;color:#333;margin-bottom:8px}
    .form-group .iw{position:relative}
    .form-group input{width:100%;height:48px;border:none;border-bottom:1.5px solid #e0e0e0;padding:0 40px 0 0;font-size:15px;font-family:inherit;color:#1a1a2e;background:transparent;outline:none;transition:border-color .3s}
    .form-group input:focus{border-bottom-color:#1a5c8a}
    .form-group input::placeholder{color:#ccc}
    .tog{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#666;padding:6px;transition:color .2s}
    .tog:hover{color:#333}
    .form-options{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .remember-me{display:flex;align-items:center;gap:8px;font-size:13px;color:#555;cursor:pointer}
    .remember-me input[type="checkbox"]{width:16px;height:16px;accent-color:#1a5c8a;cursor:pointer}
    .forgot-link{font-size:13px;color:#1a5c8a;text-decoration:none;font-weight:500;transition:opacity .2s}
    .forgot-link:hover{opacity:.8}
    .btn{position:relative;width:100%;height:50px;border-radius:25px;border:1.5px solid #1a1a2e;background:#1a1a2e;color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;overflow:hidden;margin-bottom:14px;transition:all .3s}
    .btn .tx{display:inline-block;transition:all .3s}
    .btn .hv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;background:#1a5c8a;color:#fff;opacity:0;transition:all .3s;border-radius:25px}
    .btn:hover .tx{transform:translateX(40px);opacity:0}
    .btn:hover .hv{opacity:1}
    .err{display:none;padding:10px 14px;font-size:13px;color:#dc2626;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:10px;margin-bottom:16px}
    .form-group input.err{border-bottom-color:#dc2626}
    .form-group label.err{color:#dc2626}
    .su{text-align:center;font-size:13px;color:#888;margin-top:32px}
    .su a{color:#1a1a2e;font-weight:600;text-decoration:none;transition:opacity .2s}
    .su a:hover{text-decoration:underline}
    .characters-scene{position:relative;width:480px;height:360px}
    .character{position:absolute;bottom:0;transition:all .7s ease-in-out;transform-origin:bottom center}
    .char-purple{left:60px;width:170px;height:370px;background:#6c3ff5;border-radius:10px 10px 0 0;z-index:1}
    .char-black{left:220px;width:115px;height:290px;background:#2d2d2d;border-radius:8px 8px 0 0;z-index:2}
    .char-orange{left:0;width:230px;height:190px;background:#ff9b6b;border-radius:115px 115px 0 0;z-index:3}
    .char-yellow{left:290px;width:135px;height:215px;background:#e8d754;border-radius:68px 68px 0 0;z-index:4}
    .eyes{position:absolute;display:flex;transition:all .7s ease-in-out}
    .eyeball{border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;transition:height .15s ease;overflow:hidden}
    .pupil{border-radius:50%;background:#2d2d2d;transition:transform .1s ease-out}
    .bare-pupil{width:12px;height:12px;border-radius:50%;background:#2d2d2d;transition:transform .7s ease-in-out}
    .yellow-mouth{position:absolute;width:50px;height:4px;background:#2d2d2d;border-radius:2px;transition:all .7s ease-in-out}
    @keyframes shakeHead{0%,100%{translate:0 0}10%{translate:-9px 0}20%{translate:7px 0}30%{translate:-6px 0}40%{translate:5px 0}50%{translate:-4px 0}60%{translate:3px 0}70%{translate:-2px 0}80%{translate:1px 0}90%{translate:-0.5px 0}}
    .eyes.shake-head,.yellow-mouth.shake-head,.orange-mouth.shake-head{animation:shakeHead .8s cubic-bezier(.36,.07,.19,.97) both}
    .orange-mouth{position:absolute;width:28px;height:14px;border:3px solid #2d2d2d;border-top:none;border-radius:0 0 14px 14px;opacity:0;transition:all .7s ease-in-out}
    .orange-mouth.visible{opacity:1}
    /* flash消息 -- 与JS错误样式统一 */
    .flash-msg{display:block;padding:10px 14px;font-size:13px;color:#dc2626;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:10px;margin-bottom:16px}
    @media (max-width:900px){#login-page{grid-template-columns:1fr}.left-panel{display:none}}
    /* ====== 账号切换 ====== */
    .acct-switch{margin-top:20px;padding-top:16px;border-top:1px solid #eee}
    .acct-switch-label{font-size:11px;color:#aaa;margin-bottom:8px;text-align:center}
    .acct-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    .acct-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;padding:4px;transition:all .2s;min-width:48px}
    .acct-btn:hover{transform:translateY(-2px)}
    .acct-btn:active{transform:scale(.95)}
    .acct-avatar{width:40px;height:40px;border-radius:50%;background:#eef1ff;color:#4f46e5;
      display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;
      transition:all .2s;border:2px solid transparent}
    .acct-btn.active .acct-avatar{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.12)}
    .acct-btn .acct-name{font-size:11px;color:#666;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acct-btn .acct-del{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;
      background:#ddd;color:#fff;font-size:9px;display:none;align-items:center;justify-content:center;
      border:none;cursor:pointer;transition:all .2s;line-height:1;padding:0}
    .acct-btn:hover .acct-del{display:flex;background:#ccc}
    .acct-btn .acct-del:hover{background:#dc2626;transform:scale(1.15)}
  </style>{% endraw %}
</head>
<body>
<div id="login-page">
  <div class="left-panel">
    <div class="logo">
      <div class="logo-bg">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" width="34" height="34">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0.7"/>
            </linearGradient>
          </defs>
          <!-- 盾牌轮廓 -->
          <path d="M18 3L5 9v7c0 7.5 5.5 14.5 13 17 7.5-2.5 13-9.5 13-17V9L18 3z" fill="url(#lg)" fill-opacity="0.15" stroke="#fff" stroke-width="1.2" stroke-opacity="0.4"/>
          <!-- 十字 -->
          <rect x="16" y="12" width="4" height="12" rx="1" fill="#fff" fill-opacity="0.8"/>
          <rect x="12" y="16" width="12" height="4" rx="1" fill="#fff" fill-opacity="0.8"/>
          <!-- 中心亮点 -->
          <circle cx="18" cy="18" r="2" fill="#fff" fill-opacity="0.3"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="brand">智维工控</span>
        <span class="sub">医院工单管理系统</span>
      </div>
    </div>
    <div class="characters-wrapper">
      <div class="characters-scene" id="characters-scene">
        <div class="character char-purple" id="char-purple">
          <div class="eyes" id="purple-eyes" style="left:45px;top:40px;gap:28px">
            <div class="eyeball" id="purple-eye-l" style="width:18px;height:18px"><div class="pupil" id="purple-pupil-l" style="width:7px;height:7px"></div></div>
            <div class="eyeball" id="purple-eye-r" style="width:18px;height:18px"><div class="pupil" id="purple-pupil-r" style="width:7px;height:7px"></div></div>
          </div>
        </div>
        <div class="character char-black" id="char-black">
          <div class="eyes" id="black-eyes" style="left:26px;top:32px;gap:20px">
            <div class="eyeball" id="black-eye-l" style="width:16px;height:16px"><div class="pupil" id="black-pupil-l" style="width:6px;height:6px"></div></div>
            <div class="eyeball" id="black-eye-r" style="width:16px;height:16px"><div class="pupil" id="black-pupil-r" style="width:6px;height:6px"></div></div>
          </div>
        </div>
        <div class="character char-orange" id="char-orange">
          <div class="eyes" id="orange-eyes" style="left:82px;top:90px;gap:28px">
            <div class="bare-pupil" id="orange-pupil-l"></div>
            <div class="bare-pupil" id="orange-pupil-r"></div>
          </div>
          <div class="orange-mouth" id="orange-mouth" style="left:90px;top:120px"></div>
        </div>
        <div class="character char-yellow" id="char-yellow">
          <div class="eyes" id="yellow-eyes" style="left:52px;top:40px;gap:20px">
            <div class="bare-pupil" id="yellow-pupil-l"></div>
            <div class="bare-pupil" id="yellow-pupil-r"></div>
          </div>
          <div class="yellow-mouth" id="yellow-mouth" style="left:40px;top:88px"></div>
        </div>
      </div>
    </div>
    <div class="footer-links">
      <a href="/easter-egg">隐私政策</a>
      <a href="/easter-egg">服务条款</a>
      <a href="/easter-egg">联系我们</a>
    </div>
  </div>
  <div class="right-panel">
    <div class="form-container">
      <div class="form-header">
        <h1>欢迎回来</h1>
        <p>{{ system_subtitle }}</p>
      </div>
      <form method="post" action="{{ url_for('auth.login') }}" id="login-form">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="err" id="error-msg" style="display:none"></div>
        {% set msgs = get_flashed_messages(with_categories=true) %}
        {% if msgs %}
          {% for cat, msg in msgs %}
            <div class="flash-msg" id="flash-err">{{ msg }}</div>
          {% endfor %}
        {% endif %}
        <div class="form-group">
          <label id="user-label">用户名</label>
          <div class="iw">
            <input type="text" name="username" id="username" placeholder="请输入用户名" autocomplete="off" required />
          </div>
        </div>
        <div class="form-group">
          <label id="pwd-label">密码</label>
          <div class="iw">
            <input type="password" name="password" id="password" placeholder="******" required />
            <button type="button" class="tog" id="toggle-password">
              <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-options">
          <label class="remember-me"><input type="checkbox" name="remember" checked /> 记住密码</label>
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>
        <button type="submit" class="btn" id="btn-login">
          <span class="tx">登 录</span>
          <div class="hv">
            <span>登 录</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
            </svg>
          </div>
        </button>
      </form>
      <div class="acct-switch" id="acct-switch" style="display:none">
        <div class="acct-switch-label">切换账号</div>
        <div class="acct-row" id="acct-row"></div>
      </div>
      <div class="su">没有账号？<a href="{{ url_for('auth.register') }}">注册新账号</a></div>
    </div>
  </div>
</div>
<script>
var P=document.getElementById("password"),U=document.getElementById("username"),TB=document.getElementById("toggle-password"),EI=document.getElementById("eye-icon"),EO=document.getElementById("eye-off-icon"),FM=document.getElementById("login-form"),EM=document.getElementById("error-msg"),FL=document.getElementById("flash-err");
var show=false,err=false,mx=0,my=0,typing=false,looking=false,blinkP=false,blinkB=false,peek=false,pwdFocus=false,tyT=null;
TB.addEventListener("click",function(){show=!show;P.type=show?"text":"password";EI.style.display=show?"none":"block";EO.style.display=show?"block":"none";up()});
document.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY;if(!typing&&!err)up()});
U.addEventListener("focus",function(){typing=true;looking=true;clearTimeout(tyT);tyT=setTimeout(function(){looking=false;up()},800);up()});
U.addEventListener("blur",function(){typing=false;looking=false;up()});
U.addEventListener("input",function(){up()});
P.addEventListener("focus",function(){pwdFocus=true;up()});
P.addEventListener("blur",function(){pwdFocus=false;up()});
P.addEventListener("input",function(){up()});
function schP(){setTimeout(function(){blinkP=true;up();setTimeout(function(){blinkP=false;up();schP()},150)},Math.random()*4000+3000)}
function schB(){setTimeout(function(){blinkB=true;up();setTimeout(function(){blinkB=false;up();schB()},150)},Math.random()*4000+3000)}
schP();schB();
function schPeek(){if(P.value.length>0&&show){setTimeout(function(){if(P.value.length>0&&show){peek=true;up();setTimeout(function(){peek=false;up();schPeek()},800)}},Math.random()*3000+2000)}}
TB.addEventListener("click",function(){if(show)schPeek()});
function pos(el){var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/3,dx=mx-cx,dy=my-cy;return{fx:Math.max(-15,Math.min(15,dx/20)),fy:Math.max(-10,Math.min(10,dy/30)),sk:Math.max(-6,Math.min(6,-dx/120))}}
function pup(el,d){var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=mx-cx,dy=my-cy,di=Math.min(Math.sqrt(dx*dx+dy*dy),d),an=Math.atan2(dy,dx);return{x:Math.cos(an)*di,y:Math.sin(an)*di}}
function up(){
  var P1=document.getElementById("char-purple"),P2=document.getElementById("char-black"),P3=document.getElementById("char-orange"),P4=document.getElementById("char-yellow");
  var p1=pos(P1),p2=pos(P2),p3=pos(P3),p4=pos(P4),pL=P.value.length,sP=pL>0&&show,lA=pwdFocus&&!show;
  if(sP){P1.style.transform="skewX(0deg)";P1.style.height="370px"}else if(lA){P1.style.transform="skewX(-14deg) translateX(-20px)";P1.style.height="410px"}else if(typing){P1.style.transform="skewX("+(p1.sk-12)+"deg) translateX(40px)";P1.style.height="410px"}else{P1.style.transform="skewX("+p1.sk+"deg)";P1.style.height="370px"}
  var E1=document.getElementById("purple-eyes"),L1=document.getElementById("purple-eye-l"),R1=document.getElementById("purple-eye-r"),PL1=document.getElementById("purple-pupil-l"),PR1=document.getElementById("purple-pupil-r");
  L1.style.height=blinkP?"2px":"18px";R1.style.height=blinkP?"2px":"18px";
  if(err){E1.style.left="30px";E1.style.top="55px";PL1.style.transform="translate(-3px,4px)";PR1.style.transform="translate(-3px,4px)"}else if(lA){E1.style.left="20px";E1.style.top="25px";PL1.style.transform="translate(-5px,-5px)";PR1.style.transform="translate(-5px,-5px)"}else if(sP){E1.style.left="20px";E1.style.top="35px";var px=peek?4:-4,py=peek?5:-4;PL1.style.transform="translate("+px+"px,"+py+"px)";PR1.style.transform="translate("+px+"px,"+py+"px)"}else if(looking){E1.style.left="55px";E1.style.top="65px";PL1.style.transform="translate(3px,4px)";PR1.style.transform="translate(3px,4px)"}else{E1.style.left=(45+p1.fx)+"px";E1.style.top=(40+p1.fy)+"px";var po=pup(L1,5);PL1.style.transform="translate("+po.x+"px,"+po.y+"px)";PR1.style.transform="translate("+po.x+"px,"+po.y+"px)"}
  if(sP){P2.style.transform="skewX(0deg)"}else if(lA){P2.style.transform="skewX(12deg) translateX(-10px)"}else if(looking){P2.style.transform="skewX("+(p2.sk*1.5+10)+"deg) translateX(20px)"}else if(typing){P2.style.transform="skewX("+(p2.sk*1.5)+"deg)"}else{P2.style.transform="skewX("+p2.sk+"deg)"}
  var E2=document.getElementById("black-eyes"),L2=document.getElementById("black-eye-l"),R2=document.getElementById("black-eye-r"),PL2=document.getElementById("black-pupil-l"),PR2=document.getElementById("black-pupil-r");
  L2.style.height=blinkB?"2px":"16px";R2.style.height=blinkB?"2px":"16px";
  if(err){E2.style.left="15px";E2.style.top="40px";PL2.style.transform="translate(-3px,4px)";PR2.style.transform="translate(-3px,4px)"}else if(lA){E2.style.left="10px";E2.style.top="20px";PL2.style.transform="translate(-4px,-5px)";PR2.style.transform="translate(-4px,-5px)"}else if(sP){E2.style.left="10px";E2.style.top="28px";PL2.style.transform="translate(-4px,-4px)";PR2.style.transform="translate(-4px,-4px)"}else if(looking){E2.style.left="32px";E2.style.top="12px";PL2.style.transform="translate(0px,-4px)";PR2.style.transform="translate(0px,-4px)"}else{E2.style.left=(26+p2.fx)+"px";E2.style.top=(32+p2.fy)+"px";var bo=pup(L2,4);PL2.style.transform="translate("+bo.x+"px,"+bo.y+"px)";PR2.style.transform="translate("+bo.x+"px,"+bo.y+"px)"}
  if(sP){P3.style.transform="skewX(0deg)"}else{P3.style.transform="skewX("+p3.sk+"deg)"}
  var E3=document.getElementById("orange-eyes"),M3=document.getElementById("orange-mouth"),PL3=document.getElementById("orange-pupil-l"),PR3=document.getElementById("orange-pupil-r");

// ===== 账号切换 =====
(function(){
  var KEY='login_accounts',MAX=5;
  function getAccounts(){
    try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}
  }
  function saveAccounts(arr){
    try{localStorage.setItem(KEY,JSON.stringify(arr))}catch(e){}
  }
  function _saveAccount(username){
    // 只通过API确认后保存，避免保存错误的值
    var xhr=new XMLHttpRequest();
    xhr.open('GET','/api/user-brief?username='+encodeURIComponent(username),true);
    xhr.onload=function(){
      if(xhr.status===200){
        try{
          var info=JSON.parse(xhr.responseText);
          var accts=getAccounts().filter(function(a){return a.username!==info.username});
          accts.unshift({username:info.username,display:info.display_name||info.username});
          if(accts.length>MAX)accts=accts.slice(0,MAX);
          saveAccounts(accts);
          renderAccounts();
        }catch(e){}
      }
    };
    xhr.send();
  }
  window.saveAccount=_saveAccount;
  function renderAccounts(){
    var accts=getAccounts();
    var container=document.getElementById('acct-switch');
    var row=document.getElementById('acct-row');
    if(!container||!row)return;
    if(!accts.length){container.style.display='none';return}
    container.style.display='block';
    row.innerHTML='';
    accts.forEach(function(a,i){
      var btn=document.createElement('button');
      btn.className='acct-btn'+(a.username===U.value?' active':'');
      btn.type='button';
      btn.title='切换至 '+a.username;
      var initial=(a.display||a.username).charAt(0).toUpperCase();
      btn.innerHTML='<div class="acct-avatar">'+initial+'</div>'
        +'<div class="acct-name">'+(a.display||a.username)+'</div>'
        +'<button class="acct-del" data-idx="'+i+'">×</button>';
      btn.addEventListener('click',function(e){
        if(e.target.classList.contains('acct-del'))return;
        U.value=a.username;P.value='';P.focus();
        clearErr();
        document.querySelectorAll('.acct-btn').forEach(function(b){b.classList.remove('active')});
        btn.classList.add('active');
      });
      btn.querySelector('.acct-del').addEventListener('click',function(e){
        e.stopPropagation();
        accts.splice(i,1);
        saveAccounts(accts);
        renderAccounts();
      });
      row.appendChild(btn);
    });
  }
  // 自动清理无效账号（旧代码可能存了中文名等非用户名的脏数据）
  function validateAccounts(){
    var VER='login_accounts_v',CUR=2;
    try{if(localStorage.getItem(VER)==''+CUR)return}catch(e){}
    // 逐账号校验
    var accts=getAccounts(),pending=accts.length,changed=false,next=[];
    if(!pending)return;
    accts.forEach(function(a,i){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','/api/user-brief?username='+encodeURIComponent(a.username),true);
      xhr.onload=function(){
        if(xhr.status===200){
          try{
            var info=JSON.parse(xhr.responseText);
            next.push({username:info.username,display:info.display_name||info.username});
          }catch(e){next.push(a)}
        }else{
          changed=true; // 无效账号，丢弃
        }
        pending--;
        if(pending===0){
          if(changed){saveAccounts(next);renderAccounts()}
          try{localStorage.setItem(VER,''+CUR)}catch(e){}
        }
      };
      xhr.onerror=function(){pending--;if(pending===0){try{localStorage.setItem(VER,''+CUR)}catch(e){}}};
      xhr.send();
    });
  }
  renderAccounts();
  validateAccounts();
})();

up();
