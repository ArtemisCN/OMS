<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · {{ system_name }}</title>
<link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="/static/vendor/fontawesome/all.min.css" rel="stylesheet">
<style>
body{background:#f0f4f8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.register-card{background:#fff;border-radius:16px;box-shadow:0 2px 20px rgba(0,0,0,0.06);width:100%;max-width:480px;padding:36px 32px}
.register-card h1{font-size:22px;font-weight:700;color:#1a2a3a;margin-bottom:4px}
.register-card .sub{font-size:13px;color:#8a9aa8;margin-bottom:28px}
.form-label{font-size:13px;font-weight:500;color:#3a4a5a}
.form-control{font-size:14px;border-radius:8px;border:1px solid #dce3ec;padding:9px 14px}
.form-control:focus{border-color:#1a5c8a;box-shadow:0 0 0 3px rgba(26,92,138,0.1)}
.btn-primary{background:#1a2a3a;border:none;border-radius:8px;padding:10px;font-size:14px;width:100%}
.btn-primary:hover{background:#2a3a5a}
.alert{border-radius:8px;font-size:13px}
.login-link{text-align:center;margin-top:20px;font-size:13px;color:#8a9aa8}
.login-link a{color:#1a5c8a;font-weight:500;text-decoration:none}
</style>
</head>
<body>
<div class="register-card">
<h1><i class="fas fa-user-plus" style="color:#1a5c8a;margin-right:8px"></i>注册账号</h1>
<div class="sub">提交申请后等待管理员审批</div>

{% with msgs = get_flashed_messages(with_categories=true) %}
  {% if msgs %}
    {% for cat, msg in msgs %}
      <div class="alert alert-{{ cat if cat in ['success','danger','warning','info'] else 'info' }}">{{ msg }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="post">
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label">用户名 <span class="text-danger">*</span></label>
      <input type="text" name="username" class="form-control" required placeholder="登录用" value="{{ form.get('username','') }}">
    </div>
    <div class="col-6">
      <label class="form-label">密码 <span class="text-danger">*</span></label>
      <input type="password" name="password" class="form-control" required minlength="4" placeholder="至少4位">
    </div>
    <div class="col-6">
      <label class="form-label">确认密码 <span class="text-danger">*</span></label>
      <input type="password" name="confirm_password" class="form-control" required placeholder="再次输入">
    </div>
    <div class="col-6">
      <label class="form-label">姓名 <span class="text-danger">*</span></label>
      <input type="text" name="display_name" class="form-control" required placeholder="真实姓名" value="{{ form.get('display_name','') }}">
    </div>
    <div class="col-6">
      <label class="form-label">手机号</label>
      <input type="tel" name="phone" class="form-control" placeholder="选填" value="{{ form.get('phone','') }}">
    </div>
    <div class="col-12">
      <label class="form-label">所属院区</label>
      <select name="hospital_id" class="form-control">
        <option value="">选择院区（选填）</option>
        {% for h in hospitals %}
          <option value="{{ h.id }}" {% if form.get('hospital_id')|string==h.id|string %}selected{% endif %}>{{ h.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">角色分组 <span class="text-danger">*</span></label>
      <select name="group_id" class="form-control" required>
        <option value="">选择角色组</option>
        {% for g in role_groups %}
          <option value="{{ g.id }}" {% if form.get('group_id')|string==g.id|string %}selected{% endif %}>{{ g.name }}</option>
        {% endfor %}
      </select>
      <div style="font-size:12px;color:#8a9aa8;margin-top:4px">决定账号权限范围和可访问的模块</div>
    </div>
    <div class="col-12">
      <label class="form-label">注册原因</label>
      <textarea name="reason" class="form-control" rows="3" placeholder="简单说明注册用途，方便管理员审批">{{ form.get('reason','') }}</textarea>
    </div>
    <div class="col-12 mt-3">
      <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> 提交申请</button>
    </div>
  </div>
</form>
<div class="login-link">
  已有账号？<a href="{{ url_for('auth.login') }}">去登录</a>
</div>
</div>
</body>
</html>
