# ============================================================
# 医院IT工单系统 — Docker Compose
# 服务：
#   web    — gunicorn 主服务（3 worker, WAL 已全局启用）
#   cron   — sidecar：auto_escalate(5min) / inspection_recurring(5min)
#             / cleanup(每周日) / health_monitor(每天)
# 数据卷（必须持久化，否则容器重建丢数据）：
#   workorder_data:/app/instance   — SQLite 数据库
#   workorder_uploads:/app/uploads — 上传文件
# SECRET_KEY 通过 .env 注入（.secret 是文件，无法用 named volume 挂载）
# ============================================================
services:
  web:
    build: .
    image: hospital-workorder:latest
    container_name: hospital-workorder-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # 生产：Nginx 代理 HTTPS→5000
    # 资源限制（compose 顶层字段，单机 compose 模式生效；deploy 块兼容 swarm）
    cpus: '1.0'
    mem_limit: 1024m
    mem_reservation: 512m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - TZ=Asia/Shanghai
      # SESSION_COOKIE_SECURE 由 .env 控制（生产 HTTPS 设 1；本地 http 验证不设，否则 cookie 无法发送）
      - WO_CHAT_UPLOAD_FOLDER=/app/uploads/wochat   # 容器内路径(挂 uploads 卷), 替代硬编码的 /var/www
      - UPLOAD_DIR_HOSPITAL_MAPS=/app/uploads/hospital_maps
      - UPLOAD_DIR_DT_TEXTURES=/app/uploads/dt_textures
      - UPLOAD_DIR_HOSPITALS=/app/uploads/uploads/hospitals
      - PROJECT_DIR=/app
      - BACKUP_DIR=/app/backups
    env_file:
      - .env
    volumes:
      - workorder_data:/app/instance
      - workorder_uploads:/app/uploads
      # 注意: SECRET_KEY 由 .env 注入环境变量, 不挂 .secret 卷
      # (.secret 是文件, Docker named volume 无法挂载文件路径)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # cron sidecar：共享代码卷，执行定时脚本（需 root 写 crontab）
  cron:
    build: .
    image: hospital-workorder:latest
    container_name: hospital-workorder-cron
    restart: unless-stopped
    depends_on:
      - web
    user: root
    # cron 容器不跑 gunicorn，禁用镜像自带 HEALTHCHECK（curl 5000 会永远失败）
    healthcheck:
      disable: true
    # 资源限制：cron 是轻量定时任务，配额小于 web
    cpus: '0.25'
    mem_limit: 256m
    mem_reservation: 128m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    environment:
      - TZ=Asia/Shanghai
      - WO_CHAT_UPLOAD_FOLDER=/app/uploads/wochat   # 与 web 一致，容器内路径
      - UPLOAD_DIR_HOSPITAL_MAPS=/app/uploads/hospital_maps
      - UPLOAD_DIR_DT_TEXTURES=/app/uploads/dt_textures
      - UPLOAD_DIR_HOSPITALS=/app/uploads/uploads/hospitals
      - PROJECT_DIR=/app
      - BACKUP_DIR=/app/backups
    env_file:
      - .env
    volumes:
      - workorder_data:/app/instance
      - workorder_uploads:/app/uploads
      # 注意: SECRET_KEY 由 .env 注入环境变量, 不挂 .secret 卷
      # (.secret 是文件, Docker named volume 无法挂载文件路径)
    command: >
      sh -c "
      echo '*/5 * * * * cd /app && python scripts/auto_escalate.py >> /app/logs/auto_escalate.log 2>&1' > /etc/cron.d/workorder &&
      echo '*/5 * * * * cd /app && python scripts/inspection_recurring.py >> /app/logs/inspection_recurring.log 2>&1' >> /etc/cron.d/workorder &&
      echo '0 8 * * * cd /app && python scripts/health_monitor.py >> /app/logs/health.log 2>&1' >> /etc/cron.d/workorder &&
      chmod 644 /etc/cron.d/workorder &&
      cron -f
      "

  # Nginx 反向代理（容器版）：接管宿主机 80/443
  # 使用 host 网络：proxy_pass 127.0.0.1:5000 直连宿主机 web 端口映射，无需改站点配置
  nginx:
    image: nginx:alpine
    container_name: hospital-workorder-nginx
    restart: unless-stopped
    depends_on:
      - web
    network_mode: host
    ports: []
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/static:/var/www/static:ro
      - /var/www/html:/var/www/html:ro
      - nginx_logs:/var/log/nginx

  # Prometheus 监控（host 网络：127.0.0.1:5000 直抓 web /metrics）
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hospital-workorder-prometheus
    restart: unless-stopped
    depends_on:
      - web
    network_mode: host
    ports: []
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  # Grafana 可视化（预置 datasource + 仪表盘）
  grafana:
    image: grafana/grafana:11.1.0
    container_name: hospital-workorder-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    network_mode: host
    ports: []
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3001   # 3000 可能被其他服务占用，用 3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Alertmanager：接收 Prometheus 告警，转发到 alert-notifier
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hospital-workorder-alertmanager
    restart: unless-stopped
    depends_on:
      - prometheus
    network_mode: host
    ports: []
    volumes:
      - ./docker/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=127.0.0.1:9093'

  # 告警推送接收服务：企业微信 + 短信
  alert-notifier:
    build: ./docker/monitoring/alert-notifier
    image: hospital-workorder-alert-notifier:latest
    container_name: hospital-workorder-alert-notifier
    restart: unless-stopped
    depends_on:
      - alertmanager
    network_mode: host
    ports: []
    environment:
      # 企业微信 webhook（医院1 已配置；替换为实际地址）
      - WECOM_WEBHOOK=${ALERT_WECOM_WEBHOOK:-}
      # 短信通道：API 地址/Key 从系统设置数据库读取（sms_api_url/sms_api_key/sms_enabled）
      # 只需在系统设置页面填写，notifier 自动生效
      - SMS_PHONE=${ALERT_SMS_PHONE:-}
      - DB_PATH=/app/instance/workorders.db
      - PORT=9119
    volumes:
      - workorder_data:/app/instance:ro   # 只读挂载数据库，读取短信配置

volumes:
  workorder_data:
  workorder_uploads:
  nginx_logs:
  prometheus_data:
  grafana_data:
  alertmanager_data:
