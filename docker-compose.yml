# ============================================================
# 医院IT工单系统 — Docker Compose
# 服务：
#   web    — gunicorn 主服务（3 worker, WAL 已全局启用）
#   cron   — sidecar：auto_escalate(5min) / inspection_recurring(5min)
#             / cleanup(每周日) / health_monitor(每天)
# 数据卷（必须持久化，否则容器重建丢数据）：
#   workorder_data:/app/instance   — SQLite 数据库
#   workorder_uploads:/app/uploads — 上传文件
# SECRET_KEY 通过 .env 注入（.secret 是文件，无法用 named volume 挂载）
# ============================================================
services:
  web:
    build: .
    image: hospital-workorder:latest
    container_name: hospital-workorder-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # 生产：Nginx 代理 HTTPS→5000
    # 资源限制（compose 顶层字段，单机 compose 模式生效；deploy 块兼容 swarm）
    cpus: '1.0'
    mem_limit: 1024m
    mem_reservation: 512m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - TZ=Asia/Shanghai
      # SESSION_COOKIE_SECURE 由 .env 控制（生产 HTTPS 设 1；本地 http 验证不设，否则 cookie 无法发送）
      - WO_CHAT_UPLOAD_FOLDER=/app/uploads/wochat   # 容器内路径(挂 uploads 卷), 替代硬编码的 /var/www
      - UPLOAD_DIR_HOSPITAL_MAPS=/app/uploads/hospital_maps
      - UPLOAD_DIR_DT_TEXTURES=/app/uploads/dt_textures
      - UPLOAD_DIR_HOSPITALS=/app/uploads/uploads/hospitals
      - PROJECT_DIR=/app
      - BACKUP_DIR=/app/backups
    env_file:
      - .env
    volumes:
      - workorder_data:/app/instance
      - workorder_uploads:/app/uploads
      # 注意: SECRET_KEY 由 .env 注入环境变量, 不挂 .secret 卷
      # (.secret 是文件, Docker named volume 无法挂载文件路径)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # cron sidecar：共享代码卷，执行定时脚本（需 root 写 crontab）
  cron:
    build: .
    image: hospital-workorder:latest
    container_name: hospital-workorder-cron
    restart: unless-stopped
    depends_on:
      - web
    user: root
    # cron 容器不跑 gunicorn，禁用镜像自带 HEALTHCHECK（curl 5000 会永远失败）
    healthcheck:
      disable: true
    # 资源限制：cron 是轻量定时任务，配额小于 web
    cpus: '0.25'
    mem_limit: 256m
    mem_reservation: 128m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    environment:
      - TZ=Asia/Shanghai
      - WO_CHAT_UPLOAD_FOLDER=/app/uploads/wochat   # 与 web 一致，容器内路径
      - UPLOAD_DIR_HOSPITAL_MAPS=/app/uploads/hospital_maps
      - UPLOAD_DIR_DT_TEXTURES=/app/uploads/dt_textures
      - UPLOAD_DIR_HOSPITALS=/app/uploads/uploads/hospitals
      - PROJECT_DIR=/app
      - BACKUP_DIR=/app/backups
    env_file:
      - .env
    volumes:
      - workorder_data:/app/instance
      - workorder_uploads:/app/uploads
      # 注意: SECRET_KEY 由 .env 注入环境变量, 不挂 .secret 卷
      # (.secret 是文件, Docker named volume 无法挂载文件路径)
    command: >
      sh -c "
      echo '*/5 * * * * cd /app && python scripts/auto_escalate.py >> /app/logs/auto_escalate.log 2>&1' > /etc/cron.d/workorder &&
      echo '*/5 * * * * cd /app && python scripts/inspection_recurring.py >> /app/logs/inspection_recurring.log 2>&1' >> /etc/cron.d/workorder &&
      echo '0 8 * * * cd /app && python scripts/health_monitor.py >> /app/logs/health.log 2>&1' >> /etc/cron.d/workorder &&
      chmod 644 /etc/cron.d/workorder &&
      cron -f
      "

volumes:
  workorder_data:
  workorder_uploads:
