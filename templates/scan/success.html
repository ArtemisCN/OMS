<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>提交成功</title>
    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/fontawesome/all.min.css" rel="stylesheet">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        min-height: 100vh;
        color: #e2e8f0;
        overflow-x: hidden;
    }
    body::before {
        content: '';
        position: fixed;
        top: -30%;
        left: -20%;
        width: 70%;
        height: 70%;
        background: radial-gradient(ellipse, rgba(34,197,94,0.08), transparent 70%);
        pointer-events: none;
        z-index: 0;
    }
    body::after {
        content: '';
        position: fixed;
        bottom: -20%;
        right: -20%;
        width: 60%;
        height: 60%;
        background: radial-gradient(ellipse, rgba(99,102,241,0.08), transparent 70%);
        pointer-events: none;
        z-index: 0;
    }
    .success-container {
        position: relative;
        z-index: 1;
        max-width: 460px;
        margin: 0 auto;
        padding: 40px 16px;
        text-align: center;
    }
    .success-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, rgba(34,197,94,0.2), rgba(34,197,94,0.05));
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(34,197,94,0.3);
        animation: successPulse 2s ease-in-out infinite;
    }
    .success-icon i { font-size: 36px; color: #4ade80; }
    @keyframes successPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.2); }
        50% { box-shadow: 0 0 0 16px rgba(34,197,94,0); }
    }
    .success-title {
        font-size: 22px;
        font-weight: 700;
        color: #f1f5f9;
        margin-bottom: 6px;
    }
    .success-desc {
        font-size: 14px;
        color: #94a3b8;
        margin-bottom: 24px;
    }
    .order-card {
        background: rgba(30,41,59,0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 20px;
        text-align: left;
    }
    .order-card .order-label {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 2px;
    }
    .order-card .order-value {
        font-size: 15px;
        color: #e2e8f0;
        font-weight: 500;
    }
    .order-card .order-divider {
        height: 1px;
        background: rgba(255,255,255,0.06);
        margin: 12px 0;
    }
    .btn-continue {
        display: block;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        margin-top: 16px;
        transition: transform 0.15s;
    }
    .btn-continue:active { transform: scale(0.98); }
    .btn-continue i { margin-right: 6px; }
    .scan-footer {
        text-align: center;
        padding: 20px 0 0;
        font-size: 12px;
        color: #334155;
    }
    </style>
</head>
<body>
<div class="success-container">
    <div class="success-icon"><i class="fas fa-check-circle"></i></div>
    <div class="success-title">报修提交成功！</div>
    <div class="success-desc">工程师将尽快处理您的报修</div>

    <div class="order-card">
        <div class="row g-3">
            <div class="col-6">
                <div class="order-label">工单编号</div>
                <div class="order-value">#{{ order.id }}</div>
            </div>
            <div class="col-6">
                <div class="order-label">提交时间</div>
                <div class="order-value">{{ order.created_at.strftime('%H:%M') }}</div>
            </div>
        </div>
        <div class="order-divider"></div>
        <div class="row g-3">
            <div class="col-12">
                <div class="order-label">报修内容</div>
                <div class="order-value" style="font-size:14px;font-weight:400;">{{ order.title }}</div>
            </div>
        </div>
    </div>

    <a href="{{ url_for('scan.scan_submit', hospital_id=hospital.id) }}" class="btn-continue">
        <i class="fas fa-plus"></i> 继续报修
    </a>

    <div class="scan-footer">
        <i class="fas fa-shield-alt me-1"></i> 智维工控 · 医院工单系统
    </div>
</div>
</body>
</html>
